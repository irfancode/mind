version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mind-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mind_dev
      POSTGRES_USER: mind
      POSTGRES_PASSWORD: mind_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mind -d mind_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
